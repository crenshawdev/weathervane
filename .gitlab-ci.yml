stages:
  - check
  - build
  - test

variables:
  CARGO_HOME: "${CI_PROJECT_DIR}/.cargo"

cache:
  key: "${CI_COMMIT_REF_SLUG}"
  paths:
    - .cargo/registry/cache
    - .cargo/registry/index
    - .cargo/bin
    - target

# -- check stage --------------------------------------------------------

fmt:
  stage: check
  image: rust:latest
  script:
    - rustup component add rustfmt
    - cargo fmt --check
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

clippy:
  stage: check
  image: rust:latest
  before_script:
    - apt-get update -qq && apt-get install -y -qq libssl-dev pkg-config
    - rustup component add clippy
  script:
    - cargo clippy --workspace -- -D warnings
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -- build stage --------------------------------------------------------

build:
  stage: build
  image: rust:latest
  before_script:
    - apt-get update -qq && apt-get install -y -qq libssl-dev pkg-config
  script:
    - cargo build --workspace
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

# -- test stage ---------------------------------------------------------

test:
  stage: test
  image: rust:latest
  before_script:
    - apt-get update -qq && apt-get install -y -qq libssl-dev pkg-config
  script:
    - cargo test --workspace
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

coverage:
  stage: test
  image: rust:latest
  before_script:
    - apt-get update -qq && apt-get install -y -qq libssl-dev pkg-config
    - rustup component add llvm-tools-preview
    - test -x "$CARGO_HOME/bin/cargo-llvm-cov" || cargo install cargo-llvm-cov --locked
  script:
    # Collect coverage, emit a Cobertura report for GitLab's MR widget, then
    # print the text summary so the `coverage` regex can scrape the total.
    - mkdir -p target/llvm-cov-target
    - cargo llvm-cov --no-report --workspace
    - cargo llvm-cov report --cobertura --output-path target/llvm-cov-target/cobertura.xml
    - cargo llvm-cov report --summary-only --fail-under-lines 75
  coverage: '/TOTAL\s+(\d+\s+)+(\d+\.\d+\%)/'
  artifacts:
    reports:
      coverage_report:
        coverage_format: cobertura
        path: target/llvm-cov-target/cobertura.xml
    expire_in: 1 week
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
