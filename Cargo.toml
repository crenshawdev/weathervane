[package]
name = "weathervane"
version = "0.10.1"
edition = "2021"
authors = ["John Crenshaw <john@jcrenshaw.dev>"]
license = "MIT OR Apache-2.0"
description = "Weather data, air quality, and alerts from public APIs. Fetches, parses, and returns clean Rust types."
repository = "https://github.com/crenshawdev/weathervane"
documentation = "https://docs.rs/weathervane"
exclude = [".planning/", "CLAUDE.md", ".github/"]

[dependencies]
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
quick-xml = { version = "0.41", features = ["serialize"] }
reqwest = { version = "0.13", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
urlencoding = "2.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
insta = "1"
regex = "1"
tokio = { version = "1", features = ["rt", "macros", "net", "io-util"] }
tracing-test = "0.2"
wiremock = "0.6"
