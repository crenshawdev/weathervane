[package]
name = "weathervane"
version = "0.1.1"
edition = "2021"
authors = ["VintageTechie (John Crenshaw) <john@vintagetechie.com>"]
license = "MIT OR Apache-2.0"
description = "Weather data, air quality, and alerts from public APIs. Fetches, parses, and returns clean Rust types."
repository = "https://gitlab.com/vintagetechie/weathervane"
documentation = "https://docs.rs/weathervane"

[dependencies]
async-stream = "0.3"
chrono = { version = "0.4", features = ["serde"] }
futures = "0.3"
quick-xml = { version = "0.37", features = ["serialize"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2"
tracing = "0.1"
urlencoding = "2.1"
zbus = { version = "5", default-features = false, features = ["tokio"] }
