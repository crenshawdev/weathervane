[package]
name = "weathervane-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.weathervane]
path = ".."
features = ["fuzzing"]

# Kept out of the main crate's build, tests and package.
[workspace]
members = ["."]

[[bin]]
name = "nws"
path = "fuzz_targets/nws.rs"
test = false
doc = false
bench = false

